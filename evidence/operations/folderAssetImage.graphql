query folderAssetImage($id: UUID!) {
  folderAssetImage(id: $id) {
    ...FolderAssetImageData
    createdAt
    updatedAt
    userByCreatedBy {
      id
      name
      email
    }
  }
}

fragment FolderAssetImageData on FolderAssetImage {
  id
  assetFolderId
  name
  imagePath
  folderId
  description
}
