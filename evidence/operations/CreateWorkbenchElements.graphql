mutation CreateWorkbenchElements($createDrawingsInput: [CreateDrawingInput!]!, $createDrawingsMake3dSourceTarget: CreateDrawingsMake3dSourceTargetInput, $createWorkbenchElementsPlaceholderInput: [WorkbenchElementPlaceholderInput!]!, $createWorkbenchElementsImg2ImgInput: [WorkbenchElementImg2ImgInput!]!, $createWorkbenchElementsTextInput: [WorkbenchElementTextInput!]!, $createWorkbenchElementsMixInput: [WorkbenchElementMixInput!]!, $createWorkbenchElementsSectionInput: [WorkbenchElementSectionInput!]!, $createWorkbenchElementsTryOnInput: [CreateWorkbenchElementTryOnInput!]!, $createWorkbenchElementsMake3dInput: [CreateWorkbenchElementMake3dInput!]! = [], $createWorkbenchElementsPaletteInput: [WorkbenchElementPaletteInput!]!, $createVideosInput: [VideoInput!]!, $createAnimatesInput: [WorkbenchElementAnimateInput!]!, $createMagicPromptsInput: [WorkbenchElementMagicPromptInput!]!, $createWorkbenchElementsStickyNoteInput: [WorkbenchElementStickyNoteInput!]!, $createWorkbenchElementsColorSwatchInput: [WorkbenchElementColorSwatchInput!]!, $createWorkbenchScene3DElementsInput: [WorkbenchElementScene3DCreateInput!]! = [], $duplicateRegionDrawingsInput: [DuplicateRegionDrawingInput!]! = [], $restoreRegionDrawingUndoTokens: [String!]! = []) {
  materializeRegionDrawings(
    input: {duplicates: $duplicateRegionDrawingsInput, undoTokens: $restoreRegionDrawingUndoTokens}
  ) {
    drawings {
      ...DrawingData
    }
    canvasDrawings: drawings {
      ...WorkbenchElementDrawingData
    }
  }
  createDrawings(
    input: $createDrawingsInput
    make3dSourceTarget: $createDrawingsMake3dSourceTarget
  ) {
    drawings {
      ...DrawingData
    }
    canvasDrawings: drawings {
      ...WorkbenchElementDrawingData
    }
  }
  createWorkbenchElementsPlaceholder(
    input: $createWorkbenchElementsPlaceholderInput
  ) {
    placeholders {
      ...WorkbenchElementPlaceholderData
    }
  }
  createWorkbenchElementsImg2Img(input: $createWorkbenchElementsImg2ImgInput) {
    img2Imgs {
      ...WorkbenchElementImg2ImgData
    }
  }
  createWorkbenchElementsText(input: $createWorkbenchElementsTextInput) {
    texts {
      ...WorkbenchElementTextData
    }
  }
  createWorkbenchElementsMix(input: $createWorkbenchElementsMixInput) {
    mixs {
      ...WorkbenchElementMixData
    }
  }
  createWorkbenchElementsSection(input: $createWorkbenchElementsSectionInput) {
    sections {
      ...WorkbenchElementSectionData
    }
  }
  createWorkbenchElementsTryOn(input: $createWorkbenchElementsTryOnInput) {
    tryOns {
      ...WorkbenchElementTryOnData
    }
  }
  createWorkbenchElementsMake3d(input: $createWorkbenchElementsMake3dInput) {
    make3ds {
      ...WorkbenchElementMake3dData
    }
  }
  createWorkbenchElementsPalette(input: $createWorkbenchElementsPaletteInput) {
    palettes {
      ...WorkbenchElementPaletteWithSourceImagesData
    }
  }
  createVideos(input: $createVideosInput) {
    videos {
      ...VideoData
    }
  }
  createWorkbenchElementsAnimate(input: $createAnimatesInput) {
    animates {
      ...WorkbenchElementAnimateData
    }
  }
  createWorkbenchScene3DElements(input: $createWorkbenchScene3DElementsInput) {
    scene3Ds {
      ...WorkbenchElementScene3DData
    }
  }
  createWorkbenchElementsMagicPrompt(input: $createMagicPromptsInput) {
    magicPrompts {
      ...WorkbenchElementMagicPromptData
    }
  }
  createWorkbenchElementsStickyNote(
    input: $createWorkbenchElementsStickyNoteInput
  ) {
    stickyNotes {
      ...WorkbenchElementStickyNoteData
    }
  }
  createWorkbenchElementsColorSwatch(
    input: $createWorkbenchElementsColorSwatchInput
  ) {
    colorSwatches {
      ...WorkbenchElementColorSwatchData
    }
  }
}

